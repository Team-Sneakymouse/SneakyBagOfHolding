version = 1.1.2
groupId = com.sneakybagofholding

# Maven Central coordinates (Java/Kotlin packages remain com.sneakybagofholding)
mavenCentralGroup = io.github.team-sneakymouse

# POM metadata for Maven Central (override in ~/.gradle/gradle.properties if needed)
POM_NAME = SneakyBagOfHolding
POM_DESCRIPTION = Paper plugin for virtual bag-of-holding storage with categories and autopickup.
POM_URL = https://github.com/Team-Sneakymouse/SneakyBagOfHolding
POM_INCEPTION_YEAR = 2025
POM_LICENSE_NAME = GNU General Public License v3.0
POM_LICENSE_URL = https://www.gnu.org/licenses/gpl-3.0.txt
POM_DEVELOPER_ID = team-sneakymouse
POM_DEVELOPER_NAME = Team Sneakymouse
POM_DEVELOPER_URL = https://github.com/Team-Sneakymouse
POM_SCM_URL = https://github.com/Team-Sneakymouse/SneakyBagOfHolding
POM_SCM_CONNECTION = scm:git:git@github.com:Team-Sneakymouse/SneakyBagOfHolding.git
POM_SCM_DEVELOPER_CONNECTION = scm:git:git@github.com:Team-Sneakymouse/SneakyBagOfHolding.git

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.java.installations.auto-detect=true
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64
