# SneakyBagOfHolding — see README for full documentation.

settings:
  defaults:
    item-capacity: 1000       # per-item base when items omit default-capacity
    category-capacity: 0      # category bonus when categories omit default-capacity
    global-capacity: 0        # per-player bonus applied to every item (when not overridden)
  menu:
    main-title: "<gold>Bag of Holding"
    category-rows: 6
    commands:
      - boh
      - bag
      - bagofholding
    autopickup-enchant-glow: true   # glint on category icons when autopickup is on
    # Hub filler item (slot configurable). hide-tooltip defaults true for decorative items.
    # hub-decorative:
    #   slot: 49
    #   material: GRAY_STAINED_GLASS_PANE
    #   name: "<gray> "
    # Legacy shorthand (slot 50): slot-50: { material: GRAY_STAINED_GLASS_PANE }
    
    # Hub filler fills all unused slots in the main menu except for one open slot.
    # This forces shift-clicked items to appear in the open slot for the cancel animation.
    # Tooltip is automatically hidden for filler items.
    # hub-filler:
    #   open-slot: 0
    #   material: GRAY_STAINED_GLASS_PANE
    #   custom-model-data: 1
    category:
      # Default category-browser filler (slot defaults to 50)
      # decorative:
      #   slot: 50
      #   material: GRAY_STAINED_GLASS_PANE
      # hide-tooltip: true   # optional; default true for decorative blocks
    # Place hub category icons on specific slots (0–53). Omit to fill from slot 0 upward (skips slot 50).
    # category-icon-slots:
    #   fish: 10
    #   crafting_reagent: 12
    default-item-lore:
      - "<yellow>Stored: <aqua>{stored}<yellow>/<aqua>{max}"
      - "<yellow>L-Click:<gray> Withdraw Item"
      - "<yellow>R-Click:<gray> Deposit Item"
      - "<gray>Hold Shift to move Stacks"
      - ""
      - "<yellow>Autoloot: {autoloot_status}"
      - "<gray><key:key.swapOffhand> to Toggle"
  # Pitch can be a single number (e.g., 1.0) or a range (e.g., "0.8-1.2") for random pitch
  sounds:
    withdraw:
      sound: "lom:ui.blockplink"
      pitch: 1.2
    deposit:
      sound: "lom:ui.blockplink"
      pitch: 1.0
    toggle-autoloot:
      sound: "lom:computer.open"
      pitch: 1.0
    navigate:
      sound: "lom:ui.button.click"
      pitch: 1.0
    pickup:
      sound: "minecraft:entity.item.pickup"
      pitch: "0.9-1.1"
  autopickup:
    prevent-thrown-pickup: true

categories:
  fish:
    default-capacity: 100     # overrides global category-capacity (0) for fish only
    menu-title: "<gold>Fish and Bait"
    # menu:
    #   decorative: { slot: 50, material: LIME_STAINED_GLASS_PANE, name: "<green>Fish tab" }
    #   hub-slot: 10            # optional; or use settings.menu.category-icon-slots
    menu-icon:
      material: COD
      name: "<gold>Fish and Bait"
      custom-model-data: 1
  crafting_reagent:
    default-capacity: 50      # optional override
    menu-title: "<gold>Magic Reagents"
    menu-icon:
      material: NETHER_WART
      name: "<gold>Magic Reagents"
  ore:
    # omits default-capacity → uses global category-capacity (0)
    # No menu-icon: contributes capacity only, not browsable from hub

items:
  fish-catfish1:
    categories: [fish, crafting_reagent]
    # omits default-capacity → uses global item-capacity (1000)
    display:
      # material/name/CMD from MagicSpells when available; lore always from settings.default-item-lore
      # Fallback when MagicSpells item is missing:
      material: RABBIT_FOOT
      custom-model-data: 626
      autopickup-off:
        custom-model-data: 627   # CMD override while autoloot is off (optional autopickup-on: too)
  item-banana:
    categories: [crafting_reagent]
  item-ore:
    categories: [ore, crafting_reagent]
