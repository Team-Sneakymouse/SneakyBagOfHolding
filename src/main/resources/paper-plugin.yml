name: SneakyBagOfHolding
version: '${version}'
main: com.sneakybagofholding.SneakyBagOfHolding
description: Virtual bag of holding storage with categories, stacked capacity, and autopickup.
api-version: '1.21'
authors: [Team Sneakymouse]
website: https://rawb.tv

dependencies:
  server:
    MagicSpells:
      load: AFTER
      required: false
      join-classpath: true

# Commands are registered in code via JavaPlugin#registerCommand (Paper plugins).

permissions:
  sneakybagofholding.use:
    description: Open the bag of holding menu
    default: true
  sneakybagofholding.reload:
    description: Reload plugin configuration
    default: op
  sneakybagofholding.admin:
    description: Admin give/take stored amounts
    default: op
  sneakybagofholding.admin.capacity:
    description: Set per-player item or category capacity overrides
    default: op
